services:
  db:
    env_file:
      - backend/.env
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: notable
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notable"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: backend/.env
    depends_on:
      db:
        condition: service_healthy
    command: >-
      sh -c "alembic -c backend/alembic/alembic.ini upgrade head
      && uvicorn backend.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"

  frontend:
    env_file: frontend/.env
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
